<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PF - Forgot Password</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>
  <div class="auth-page">
    <!-- Background -->
    <img class="auth-bg" src="https://images.unsplash.com/photo-1758343660101-10ee4fa1ca68?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w4NDM0ODN8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NzAxMzE2OTh8&ixlib=rb-4.1.0&q=80&w=1080" alt="Forest background">
    <div class="auth-overlay"></div>

    <!-- Content -->
    <div class="auth-content" style="justify-content: flex-start; padding-top: 60px;">
      <!-- App Icon -->
      <div class="auth-app-icon auth-app-icon--sm">
        <span class="material-symbols-rounded">park</span>
      </div>

      <!-- Title -->
      <h1 class="auth-app-title auth-app-title--sm">Pomodoro Forest</h1>
      <p class="auth-app-subtitle auth-app-subtitle--muted">Recupera el acceso a tu cuenta</p>

      <!-- Forgot Card -->
      <div class="auth-card--light auth-card--light-460">
        <h2 class="auth-card-title">Recuperar Contraseña</h2>

        <p class="auth-card-desc">Ingresa tu email y te enviaremos un codigo para restablecer tu contraseña</p>

        <!-- Email input -->
        <div class="auth-input-group">
          <label class="auth-input-label--sm">Correo electronico</label>
          <div class="auth-input--icon">
            <span class="material-symbols-rounded">mail</span>
            <span class="input-placeholder">tu@email.com</span>
          </div>
        </div>

        <!-- Send button -->
        <button class="auth-btn auth-btn--pill">
          <span class="material-symbols-rounded">send</span>
          Enviar codigo
        </button>
      </div>

      <!-- Back link -->
      <a class="auth-link--back" href="login.html">← Volver al inicio de sesion</a>
    </div>

    <!-- Footer -->
    <div class="auth-footer">
      <span class="auth-footer-text">Pomodoro Forest © 2025</span>
      <span class="auth-footer-sub">Recupera el acceso a tu cuenta de forma segura</span>
    </div>
  </div>
</body>
</html>
